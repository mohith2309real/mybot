# Builds MyBot 2.0 for Windows, macOS and Linux, and publishes a GitHub release.
#
# - On a pull request that touches mybot2/: tests, then builds every platform
#   as a check; the archives are attached to the run as artifacts.
# - On main: the same, and if this version (mybot2/Cargo.toml) has no release
#   yet, publishes v<version> with the archives. Bump the version to release.
# - On a pushed v* tag, or run by hand with a tag: publishes that tag.
#
# A release is published only when the tests and every build pass. Each one
# carries latest.json (version, and each download's URL, size and SHA-256) and
# latest.json.sig, an Ed25519 signature of it made with the
# MYBOT_UPDATE_SIGNING_KEY secret; the app installs updates only when that
# signature checks out against the public key compiled into it.
#
# The website (site/, https://my-bot.web.app on Firebase) reads the latest
# release from GitHub when it loads, so releases need no site deploy; deploy
# site changes with site/deploy.sh.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["mybot2/**", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (created on this commit if it doesn't exist)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' mybot2/Cargo.toml | head -1)
          case "$EVENT" in
            workflow_dispatch) tag="$INPUT_TAG"; publish=true ;;
            push)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                tag="$GITHUB_REF_NAME"; publish=true
              else
                tag="v$version"
                if gh release view "$tag" >/dev/null 2>&1; then publish=false; else publish=true; fi
              fi ;;
            *) tag="v$version"; publish=false ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version → tag $tag, publish: $publish"

  test:
    name: Test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The vault test reads files written by MyBot 1.x, which runs on Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mybot2
      - run: cargo test --workspace --locked
        working-directory: mybot2

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    defaults:
      run:
        shell: bash
        working-directory: mybot2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mybot2
          key: ${{ matrix.target }}
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Build
        run: cargo build --release --locked -p mybot-app --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir="mybot2-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/mybot2" README.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Package (macOS app)
        if: runner.os == 'macOS'
        run: |
          dir="mybot2-$TAG-${{ matrix.name }}"
          app="$dir/MyBot.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/mybot2" "$app/Contents/MacOS/mybot2"
          # The MyBot mark (assets/icon.svg); regenerate the .icns with
          # MYBOT_ICON_OUT=dir cargo test -p mybot-app write_iconset -- --ignored
          cp assets/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MyBot</string>
            <key>CFBundleDisplayName</key><string>MyBot</string>
            <key>CFBundleIdentifier</key><string>app.mybot.desktop</string>
            <key>CFBundleExecutable</key><string>mybot2</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleShortVersionString</key><string>${TAG#v}</string>
            <key>CFBundleVersion</key><string>${TAG#v}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          cp README.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          dir="mybot2-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/mybot2.exe" README.md "$dir/"
          7z a "$dir.zip" "$dir" >/dev/null
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"

      - name: Smoke test
        run: |
          exe="target/${{ matrix.target }}/release/mybot2"
          if [ "${{ runner.os }}" = "Windows" ]; then exe="$exe.exe"; fi
          "$exe" --version
          "$exe" sites github

      - name: Checksum
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
          cat "$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: mybot2-${{ matrix.name }}
          path: |
            mybot2/${{ env.ASSET }}
            mybot2/${{ env.ASSET }}.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [plan, test, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Update manifest (latest.json)
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os, datetime
          tag = os.environ["TAG"]; repo = os.environ["GITHUB_REPOSITORY"]
          assets = {}
          for f in sorted(glob.glob("dist/mybot2-*")):
              if f.endswith(".sha256"):
                  continue
              name = os.path.basename(f)
              key = name[len(f"mybot2-{tag}-"):].removesuffix(".tar.gz").removesuffix(".zip")
              data = open(f, "rb").read()
              assets[key] = {
                  "name": name,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          assert set(assets) == {"linux-x86_64", "macos-arm64", "macos-x86_64", "windows-x86_64"}, assets.keys()
          manifest = {
              "version": tag.removeprefix("v"),
              "tag": tag,
              "published": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "assets": assets,
          }
          open("dist/latest.json", "w").write(json.dumps(manifest, indent=2) + "\n")
          PY
          cat dist/latest.json

      - name: Sign the manifest
        env:
          SIGNING_KEY: ${{ secrets.MYBOT_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::MYBOT_UPDATE_SIGNING_KEY is not set, so this release couldn't be signed and apps wouldn't install it."
            exit 1
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          # The secret must belong to the public key compiled into the app, or
          # every update would be refused. Check before publishing anything.
          have=$(openssl pkey -in "$RUNNER_TEMP/key.pem" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          want=$(sed -n '/pub const PUBLIC_KEY/,/];/p' mybot2/crates/app/src/update.rs | grep -o '0x[0-9a-f][0-9a-f]' | sed 's/0x//' | tr -d '\n')
          if [ "$have" != "$want" ]; then
            echo "::error::The signing key doesn't match the public key in mybot2/crates/app/src/update.rs."
            exit 1
          fi
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/key.pem" -in dist/latest.json -out "$RUNNER_TEMP/sig.bin"
          openssl base64 -A -in "$RUNNER_TEMP/sig.bin" > dist/latest.json.sig
          # And verify it the way the app will.
          openssl pkey -in "$RUNNER_TEMP/key.pem" -pubout -out "$RUNNER_TEMP/pub.pem"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/pub.pem" -in dist/latest.json -sigfile "$RUNNER_TEMP/sig.bin"
          rm -f "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/sig.bin" "$RUNNER_TEMP/pub.pem"

      - name: Create or update the release
        run: |
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "MyBot ${TAG#v}" --notes-file mybot2/RELEASE_NOTES.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "MyBot ${TAG#v}" --notes-file mybot2/RELEASE_NOTES.md
          fi
