[workspace]
resolver = "3"
members = [
  "crates/vault",
  "crates/core",
  "crates/computer",
  "crates/actions",
  "crates/catalog",
  "crates/app",
]

[workspace.package]
version = "2.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
mybot-vault = { path = "crates/vault" }
mybot-core = { path = "crates/core" }
mybot-computer = { path = "crates/computer" }
mybot-actions = { path = "crates/actions" }
mybot-catalog = { path = "crates/catalog" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
base64 = "0.22"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
regex = "1"
tokio-tungstenite = "0.24"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
dirs = "5"
toml = "0.8"
rpassword = "7"
des = "0.8"
once_cell = "1"
async-trait = "0.1"

# Dependencies build optimised even in debug: scrypt at opt-level 0 takes
# seconds per unlock, which makes the vault tests (and the app) crawl.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
